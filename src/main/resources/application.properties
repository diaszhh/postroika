spring.application.name=postroika
# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/postroika_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
# Web server
server.port=8000

spring.jackson.time-zone=UTC
spring.jackson.locale=ru_RU

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/postroika
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/postroika/protocol/openid-connect/certs
